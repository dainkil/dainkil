name: Metrics
on:
  schedule: [{cron: "0 15 * * *"}]  # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # classic 템플릿: 헤더 + 주 사용 언어 + 코드 변경량 추이
      - name: Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header
          config_timezone: Asia/Seoul
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          # habits는 GitHub PushEvent 응답에서 commits가 빠져 upstream에서 깨짐
          # lines repositories 섹션은 private 레포 이름이 노출돼서 history만 사용
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_delay: 10
